<div class="header-fade" aria-hidden="true"></div>
<header class="site-header">
  <div class="cf-header-inner">
    <a href="/" class="brand" aria-label="CoupleFit">
        <svg class="logo-mark" viewBox="0 0 30 22" aria-hidden="true">
        <defs>
          <clipPath id="cf-overlap"><circle cx="11" cy="11" r="9"/></clipPath>
        </defs>
        <circle cx="11" cy="11" r="9" fill="#5B1E2D"/>
        <circle cx="19" cy="11" r="9" fill="#B7C6D6"/>
        <circle cx="19" cy="11" r="9" fill="#1E2A44" clip-path="url(#cf-overlap)"/>
      </svg>
      <span class="logo-text">CoupleFit</span>
    </a>

    <nav class="cf-nav">
      <a href="#features">Features</a>
      <a href="#story">Story</a>
      <a href="#plans">Pricing</a>
      <a href="#faq">FAQ</a>
    </nav>

    <a href="/#cta" class="cf-cta">Become a Founding Couple</a>
        <label for="cf-menu-toggle" class="cf-burger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </label>
  </div>

  <style>
    /* ===== Floating glass header (Apple-style) ===== */
    .site-header {
      position: sticky;
      top: 12px;
      z-index: 100;
      margin: 12px clamp(12px, 2vw, 24px) 0;
      padding: 10px 10px 10px 28px;
      border-radius: 999px;

      /* glass */
      background: rgba(255, 255, 255, 0.88);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);

      /* subtle edge + depth */
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 8px 32px rgba(20, 20, 20, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);

      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    /* Slightly more solid when scrolled, for readability */
    .site-header.is-scrolled {
      background: rgba(255, 255, 255, 0.94);
      box-shadow:
        0 10px 36px rgba(20, 20, 20, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    /* Fallback if blur is not supported */
    @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
      .site-header { background: rgba(255, 255, 255, 0.96); }
    }

    /* Layout: logo left, menu centered, button right */
    .site-header .cf-header-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      max-width: none;
      margin: 0;
      padding: 0;
    }

    /* Logo */
    .site-header .brand {
      justify-self: start;
      display: flex;
      align-items: center;
    }

    .site-header .logo {
      height: 34px;
      width: auto;
      max-height: none;
      display: block;
    }

    /* Menu links */
    .site-header .cf-nav {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .site-header .cf-nav a {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #1d1d1f;
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.2s ease;
    }

    .site-header .cf-nav a:hover {
      opacity: 1;
    }

    /* Main button */
    .site-header .cf-cta {
      justify-self: end;
      align-self: center;
      margin: 0;
      display: inline-flex;
      align-items: center;
      padding: 11px 22px;
      border-radius: 999px;
      background: var(--navy, #3d5479);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .site-header .cf-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(61, 84, 121, 0.25);
    }

    /* Mobile: compacter, menu-links verborgen */
    @media (max-width: 768px) {
      .site-header {
        top: 8px;
        margin: 8px 8px 0;
        padding: 8px 8px 8px 18px;
      }
      .site-header .cf-header-inner {
        grid-template-columns: 1fr auto;
      }
      .site-header .cf-nav {
        display: none;
      }
      .site-header .logo {
        height: 28px;
      }
      .site-header .cf-cta {
        padding: 9px 16px;
        font-size: 14px;
      }
    }
      /* Zachte vervaging bovenaan: inhoud lost op vóór de balk */
    .header-fade {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 84px;
      z-index: 99;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.94);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
    }

    @media (max-width: 768px) {
      .header-fade {
        height: 64px;
      }
    }
      /* Oude regels in style.css zetten de ruimte bovenin op 0; dit herstelt het */
    .site-header {
      margin-top: 12px !important;
      padding-top: 10px !important;
    }

    @media (max-width: 768px) {
      .site-header {
        margin-top: 8px !important;
        padding-top: 8px !important;
      }
    }
      /* ===== Mobiel hamburger-menu (Apple-stijl) ===== */
    .cf-burger,
    .cf-menu-toggle,
    .cf-mobile-menu {
      display: none;
    }

    @media (max-width: 768px) {
      /* Knop uit de header; die staat nu onderaan in het menu */
      .site-header .cf-cta {
        display: none;
      }

      /* Drie streepjes */
      .cf-burger {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
        width: 44px;
        height: 44px;
        justify-self: end;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .cf-burger span {
        display: block;
        width: 22px;
        height: 2px;
        border-radius: 2px;
        background: #1E2A44;
      }

      /* Volledig scherm menu */
      .cf-mobile-menu {
        display: flex;
        flex-direction: column;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #FAF8F5;
        padding: calc(96px + env(safe-area-inset-top)) 36px calc(40px + env(safe-area-inset-bottom));
        overflow-y: auto;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      .cf-menu-toggle:checked ~ .cf-mobile-menu {
        opacity: 1;
        visibility: visible;
      }

      /* Kruisje rechtsboven */
      .cf-menu-close {
        position: absolute;
        top: calc(16px + env(safe-area-inset-top));
        right: 16px;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .cf-menu-close svg {
        width: 22px;
        height: 22px;
        stroke: #1E2A44;
        stroke-width: 2;
        stroke-linecap: round;
        fill: none;
      }

      /* Grote menu-links */
      .cf-mobile-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .cf-mobile-nav a {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: #1E2A44;
        text-decoration: none;
        padding: 6px 0;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      .cf-menu-toggle:checked ~ .cf-mobile-menu .cf-mobile-nav a {
        opacity: 1;
        transform: none;
      }
      .cf-menu-toggle:checked ~ .cf-mobile-menu .cf-mobile-nav a:nth-child(2) { transition-delay: 0.04s; }
      .cf-menu-toggle:checked ~ .cf-mobile-menu .cf-mobile-nav a:nth-child(3) { transition-delay: 0.08s; }
      .cf-menu-toggle:checked ~ .cf-mobile-menu .cf-mobile-nav a:nth-child(4) { transition-delay: 0.12s; }

      /* Burgundy knop onderaan */
      .cf-mobile-cta {
        margin-top: auto;
        display: block;
        text-align: center;
        padding: 16px 24px;
        border-radius: 999px;
        background: #5B1E2D;
        color: #F3EFE6;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }

      /* Pagina niet laten scrollen als menu open is */
      html:has(#cf-menu-toggle:checked),
      html:has(#cf-menu-toggle:checked) body {
        overflow: hidden;
      }
    }
  </style>
</header>

<input type="checkbox" id="cf-menu-toggle" class="cf-menu-toggle" aria-hidden="true">
<div class="cf-mobile-menu">
  <label for="cf-menu-toggle" class="cf-menu-close" aria-label="Sluit menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </label>
  <nav class="cf-mobile-nav">
    <a href="#features" onclick="document.getElementById('cf-menu-toggle').checked=false">Features</a>
    <a href="#story" onclick="document.getElementById('cf-menu-toggle').checked=false">Story</a>
    <a href="#plans" onclick="document.getElementById('cf-menu-toggle').checked=false">Pricing</a>
    <a href="#faq" onclick="document.getElementById('cf-menu-toggle').checked=false">FAQ</a>
  </nav>
  <a href="/#cta" class="cf-mobile-cta" onclick="document.getElementById('cf-menu-toggle').checked=false">Become a Founding Couple</a>
</div>

<script>
  (function () {
    const h = document.querySelector('.site-header');
    if (!h) return;
    const onScroll = () => {
      if (window.scrollY > 8) h.classList.add('is-scrolled');
      else h.classList.remove('is-scrolled');
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  })();
</script>
